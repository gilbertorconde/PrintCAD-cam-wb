id = "io.github.gilbertorconde.cam"
name = "CAM"
version = "0.4.1"
api = "printcad:workbench@0.1"
description = "3-axis CNC toolpaths on the document's solids with camcraft, checked against the material and written as G-code"
feature_kinds = ["io.github.gilbertorconde.cam.setup", "io.github.gilbertorconde.cam.operation"]

[capabilities]
save_dialog = true
# Fusion tool libraries and machine profiles to import.
open_dialog = true
# The machining runs in camcraft-helper, a native program the package ships
# for each system, on every core.
helper = true
