name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (toolchain and target from rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --release -- -D warnings

      - name: Tests (on the build machine; the package logic is plain Rust)
        run: cargo test --target x86_64-unknown-linux-gnu

      - name: Pack
        run: scripts/pack.sh

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/*.pcbench
