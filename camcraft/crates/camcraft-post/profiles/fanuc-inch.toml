# Fanuc 0i and 31i, and the many controls that read Fanuc's ISO G-code, with
# programs written in inches: the Fanuc profile with `units = "inch"`, which
# writes G20 and converts every length and feed, a feed to a tenth. Kept the
# same as fanuc.toml in everything else (a test in src/profile.rs checks it).
#
# Written from Fanuc's programming manuals (Series 0i-MF, 30i/31i-B): a tape
# begins and ends with `%`, the program's number, `O1001`, comes first, then a
# safe start, `G90 G94 G17 G40 G49 G80`. Every length has its point, as `Z2.` or
# `X10.`: on a Fanuc set to read a number without one in its least increment,
# `X10` is 10 microns. Z goes home with `G28 G91 Z0.` before a tool change and
# at the end, X and Y after it. A change is `T<n> M6`, the next program's tool
# called up after it (`preselect_tool`) so the changer has it ready, and the
# first move down takes up the tool's length with `G43 Z.. H<tool>`. Comments in
# capitals, holding only what a Fanuc reads in one, as Fusion's Fanuc post
# writes them.
#
# Every program is O1001: give each its own number as it goes into the control's
# memory. Blocks are not numbered: a long program would number past N99999,
# which Fanuc refuses; `[numbering] enabled = true` numbers them.
#
# VALIDATE ON THE MACHINE with a dry run well above the work before trusting it
# on material -- a post that has only ever been read is a post that has never been
# tested.

name      = "Fanuc (inch)"
extension = "nc"
comment   = ["(", ")"]
comment_chars = " ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.,=_-"
comment_upper = true

arc_style      = "ij"
tool_change    = "m6"
length_offset  = true
preselect_tool = true
# Fanuc takes G81, G82, G83, G73, G84 and G74, returning with G98. Off until
# they have been dry-run on the machine; off, a drilling operation is posted as
# plain moves instead, and tapping is refused. A Fanuc that taps rigidly wants
# M29 S.. before G84, which is not written: check the machine's tapping first.
drill_cycles = false
# A pause, G82's P, in milliseconds, as Fanuc reads it without a point.
dwell_milliseconds = true

units = "inch"

# Work offsets past G59: Fanuc's additional offsets, G54.1 P1 to P48 (the
# option most 0i and 31i have), a setup's offsets after G59.
extended_offsets = [
  "G54.1 P1", "G54.1 P2", "G54.1 P3", "G54.1 P4", "G54.1 P5", "G54.1 P6",
  "G54.1 P7", "G54.1 P8", "G54.1 P9", "G54.1 P10", "G54.1 P11", "G54.1 P12",
  "G54.1 P13", "G54.1 P14", "G54.1 P15", "G54.1 P16", "G54.1 P17", "G54.1 P18",
  "G54.1 P19", "G54.1 P20", "G54.1 P21", "G54.1 P22", "G54.1 P23", "G54.1 P24",
  "G54.1 P25", "G54.1 P26", "G54.1 P27", "G54.1 P28", "G54.1 P29", "G54.1 P30",
  "G54.1 P31", "G54.1 P32", "G54.1 P33", "G54.1 P34", "G54.1 P35", "G54.1 P36",
  "G54.1 P37", "G54.1 P38", "G54.1 P39", "G54.1 P40", "G54.1 P41", "G54.1 P42",
  "G54.1 P43", "G54.1 P44", "G54.1 P45", "G54.1 P46", "G54.1 P47", "G54.1 P48",
]

header = [
  "%",
  "O1001 ({name})",
  "(GENERATED BY CAMCRAFT -- VERIFY BEFORE RUNNING)",
  "G90 G94 G17 G40 G49 G80",
]

safe_retract = ["G28 G91 Z0.", "G90"]
end_home     = ["G28 G91 X0. Y0.", "G90"]

footer = [
  "M30",
  "%",
]

[format]
axis_decimals        = 3
inch_axis_decimals   = 4
feed_decimals        = 1
strip_trailing_zeros = true
keep_point           = true

[numbering]
enabled = false

[modal]
suppress_motion = true
suppress_axes   = true
suppress_feed   = true
