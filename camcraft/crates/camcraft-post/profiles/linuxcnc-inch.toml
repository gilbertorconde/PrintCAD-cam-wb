# LinuxCNC (and the controllers that follow its G-code, such as PathPilot),
# programs written in inches: the LinuxCNC profile with `units = "inch"`, which
# writes G20 and converts every length and feed. Kept the same as linuxcnc.toml
# in everything else (a test in src/profile.rs checks it).
#
# Written from LinuxCNC's G-code reference: tools come from the tool table, so a
# change is `T<n> M6` and the first move down after it takes up the tool's length
# with `G43 Z.. H<tool>`.
#
# VALIDATE ON THE MACHINE with a dry run well above the work before trusting it
# on material -- a post that has only ever been read is a post that has never been
# tested.

name      = "LinuxCNC (inch)"
extension = "ngc"
comment   = ["(", ")"]

arc_style     = "ij"
tool_change   = "m6"
tool_change_seconds = 30
length_offset = true
# LinuxCNC is the reference for these cycles (its G-code reference, 2.8 and
# 2.9): G81, G82 with its dwell in seconds, G83, and G73, which backs off
# 0.254 mm to break the chip, all returning to where they began with G98.
drill_cycles = true
# Tapping is rigid tapping, G33.1 Z.. K<pitch>: synchronized with the spindle
# down and back, which reverses itself at the bottom, a hole at a time. It
# needs a spindle encoder with an index; without one it waits at the top of
# the first hole for the index and never goes down. LinuxCNC's G84 and G74 are
# for a floating tap holder and do not keep the feed to the spindle, so they
# are not written. A left-hand tap is started M4; the reference does not say
# G33.1 taps that way, so air-cut one first.
tap = "g33.1"
# A probe operation touches with G38.2, which stops where the probe touches
# and stops the program with an error if it never does, and logs each point
# to the file (PROBEOPEN name) opens, until (PROBECLOSE): a line a point,
# X Y Z then the other axes, in the program's coordinates and units.
probe = "g38.2-probeopen"

# Work offsets past G59: a setup may use LinuxCNC's G59.1 to G59.3.
extended_offsets = ["G59.1", "G59.2", "G59.3"]

units = "inch"

# The spindle's slowest and fastest, in rev/min: set them to the machine's, and a
# tool asked to turn outside them is warned about.
# spindle = [6000, 24000]

# A tool change of the machine's own, in place of `T<n> M6`: it must name the
# tool, @tool@. Every block below takes placeholders too (src/profile.rs lists
# them), such as @operation@ or @tool_comment@.
# tool_change_lines = ["(@tool_comment@)", "T@tool@ M6", "M0 (check tool @tool@)"]

header = [
  "({name})",
  "(generated by camcraft -- verify before running)",
  "G90 G94 G17 G40 G49 G80",
]

# Z to the top of its travel in machine coordinates, where LinuxCNC homes it,
# before a tool change and at the end.
safe_retract = ["G53 G0 Z0"]

footer = [
  "M30",
]

[format]
axis_decimals        = 3
inch_axis_decimals   = 4
feed_decimals        = 1
strip_trailing_zeros = true

[numbering]
enabled = false

[modal]
suppress_motion = true
suppress_axes   = true
suppress_feed   = true

# How far the machine goes, in its own coordinates and the program's units (inches here):
# set it to the machine's limits, and a program that goes past them, its work
# zero where the setup says its work offset is and the tool's length added to Z
# for G43, is a failed check. G53 G0 Z0 above must be inside it. (Without
# `coordinates = "machine"`, the ranges are from the work zero as it is
# usually set.)
# [travel]
# coordinates = "machine"
# x = [0, 12]
# y = [-8, 0]
# z = [-5, 0]

# Machining time. Typical of a small mill or router, not of any one: the
# machine's are each axis's MAX_VELOCITY in its INI file, in its units a
# second: times 60 for mm/min, and by 25.4 more for an inch machine. A change
# by hand, as LinuxCNC's M6 asks for one by default, is about half a minute.
[rapid]  # mm/min, whatever the program's units
x = 5000
y = 5000
z = 3000
