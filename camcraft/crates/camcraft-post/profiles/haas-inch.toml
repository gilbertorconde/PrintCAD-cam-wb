# Haas mills on the Next Generation Control (NGC), with programs written in
# inches: the Haas profile with `units = "inch"`, which writes G20 and converts
# every length and feed, a feed to a hundredth. Kept the same as haas.toml in
# everything else (a test in src/profile.rs checks it).
#
# Written from Haas's mill operator's manual and G-code reference: Fanuc's
# G-code, with Haas's own ways. A tape begins and ends with `%`, the program's
# number, `O01001`, five digits, first; a safe start, `G90 G94 G17 G40 G49 G80`;
# lengths with their point. Z goes to the top of its travel in machine
# coordinates, `G53 G0 Z0.`, before a tool change and at the end, and the table
# to machine X0 Y0 after, as Fusion's Haas post sends it. A change is `T<n> M6`,
# the next program's tool called up after it (`preselect_tool`) so the side-mount
# changer has it ready, and the first move down takes up the tool's length with
# `G43 Z.. H<tool>`.
#
# The program's number is its setup's in five digits, @number5@ (O01001 unless
# the setup says): give each setup its own as it goes into the control's
# memory. Blocks are not numbered; `[numbering] enabled = true`
# numbers them.
#
# Smoothing and look-ahead are the machine's own unless a line says: to set them
# for every program, add to the header one of
#   "G187 P1 (smoothing: rough)", "G187 P2 (smoothing: medium)",
#   "G187 P3 (smoothing: finish)", or "G187 P3 E0.01" with a corner tolerance,
# and "G103 P1" limits look-ahead to a block, as a probe or a dry run may want.
# A stop between programs the operator can turn off is "M1" in the footer,
# before "M30". All of these read back.
#
# VALIDATE ON THE MACHINE with a dry run well above the work before trusting it
# on material -- a post that has only ever been read is a post that has never been
# tested.

name      = "Haas (NGC, inch)"
extension = "nc"
comment   = ["(", ")"]

arc_style      = "ij"
tool_change    = "m6"
tool_change_seconds = 5
length_offset  = true
preselect_tool = true
# Haas takes G81, G82, G83, G73, G84 and G74, returning with G98. Off until they
# have been dry-run on the machine; off, a drilling operation is posted as plain
# moves instead.
drill_cycles = false
# Tapping is G84 (G74 left-hand), which a Haas mill taps rigidly by itself,
# timing Z to the spindle's position: no M29.
tap = "g84"

units = "inch"

# Work offsets past G59: Haas's G154 P1 to P99, a setup's offsets after G59.
extended_offsets = [
  "G154 P1", "G154 P2", "G154 P3", "G154 P4", "G154 P5", "G154 P6", "G154 P7",
  "G154 P8", "G154 P9", "G154 P10", "G154 P11", "G154 P12", "G154 P13",
  "G154 P14", "G154 P15", "G154 P16", "G154 P17", "G154 P18", "G154 P19",
  "G154 P20", "G154 P21", "G154 P22", "G154 P23", "G154 P24", "G154 P25",
  "G154 P26", "G154 P27", "G154 P28", "G154 P29", "G154 P30", "G154 P31",
  "G154 P32", "G154 P33", "G154 P34", "G154 P35", "G154 P36", "G154 P37",
  "G154 P38", "G154 P39", "G154 P40", "G154 P41", "G154 P42", "G154 P43",
  "G154 P44", "G154 P45", "G154 P46", "G154 P47", "G154 P48", "G154 P49",
  "G154 P50", "G154 P51", "G154 P52", "G154 P53", "G154 P54", "G154 P55",
  "G154 P56", "G154 P57", "G154 P58", "G154 P59", "G154 P60", "G154 P61",
  "G154 P62", "G154 P63", "G154 P64", "G154 P65", "G154 P66", "G154 P67",
  "G154 P68", "G154 P69", "G154 P70", "G154 P71", "G154 P72", "G154 P73",
  "G154 P74", "G154 P75", "G154 P76", "G154 P77", "G154 P78", "G154 P79",
  "G154 P80", "G154 P81", "G154 P82", "G154 P83", "G154 P84", "G154 P85",
  "G154 P86", "G154 P87", "G154 P88", "G154 P89", "G154 P90", "G154 P91",
  "G154 P92", "G154 P93", "G154 P94", "G154 P95", "G154 P96", "G154 P97",
  "G154 P98", "G154 P99",
]

header = [
  "%",
  "O@number5@ ({name})",
  "(generated by camcraft -- verify before running)",
  "G90 G94 G17 G40 G49 G80",
]

safe_retract = ["G53 G0 Z0."]
end_home     = ["G53 G0 X0. Y0."]

footer = [
  "M30",
  "%",
]

[format]
axis_decimals        = 3
inch_axis_decimals   = 4
feed_decimals        = 2
strip_trailing_zeros = true
keep_point           = true

[numbering]
enabled = false

[modal]
suppress_motion = true
suppress_axes   = true
suppress_feed   = true

# Machining time. A VF-series mill's rapids, 1000 in/min on each axis as Haas
# gives them for the VF-2, and about five seconds chip to chip for its
# carousel changer: typical, not your machine's, which its spec sheet gives.
[rapid]  # mm/min, whatever the program's units
x = 25400
y = 25400
z = 25400
