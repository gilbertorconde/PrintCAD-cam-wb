# Heidenhain TNC controls (TNC 620, 640, iTNC 530 and the like), in their
# conversational language, Klartext: `.h` programs, written in inches. The
# Heidenhain profile with `units = "inch"`: `BEGIN PGM .. INCH`, every length
# in inches and every feed in tenths of an inch a minute, to a tenth. Kept the
# same as heidenhain.toml in everything else (a test in src/profile.rs checks
# it).
#
# Written from Heidenhain's Klartext programming manual (TNC 620) and as
# Fusion's Heidenhain post writes: not G-code, so `dialect = "heidenhain"`, and
# src/heidenhain.rs writes it and reads it back. Every block numbered from 0, `;`
# comments, `BEGIN PGM` and `END PGM` round it, the stock as `BLK FORM`.
# `TOOL CALL <n> Z S<rpm>` changes the tool and takes up its length and radius
# from the tool table; `M3` starts the spindle. Z goes to the top of the
# machine, `L Z+0 R0 FMAX M91` (Z0 in machine coordinates, where Fusion's post
# sends it), before a tool change and at the end. The work offset is a row of
# the preset table, `CYCL DEF 247 DATUM SETTING`: G54 its first row, G59 its
# sixth.
#
# On a control whose machine Z0 is not the top of its travel, retract with
# M140 instead, as far up the tool axis as it goes:
#   safe_retract = ["L M140 MB MAX"]
# To call up the next program's tool after the change, `TOOL DEF <n>`, for a
# changer that can: preselect_tool = true.
#
# VALIDATE ON THE MACHINE with a dry run well above the work before trusting it
# on material -- a post that has only ever been read is a post that has never been
# tested.

name      = "Heidenhain TNC (Klartext, inch)"
extension = "h"
dialect   = "heidenhain"
comment   = [";", ""]

# Arcs are always by their centre, CC, in Klartext.
arc_style   = "ij"
tool_change = "m6"
# Drilling as CYCL DEF 200 (drilling, pecking, a pause at the bottom), 203
# (breaking the chip) and 207 (rigid tapping), each called by M99 at its hole.
# Off until they have been dry-run on the machine; off, a drilling operation is
# posted as plain moves instead, and tapping is refused.
drill_cycles = false

units = "inch"

header = [
  ";generated by camcraft -- verify before running",
]

safe_retract = ["L Z+0 R0 FMAX M91"]

footer = [
  "M30",
]

# Every coordinate with its sign, `X+10`, as the control writes them; feeds in
# mm/min, and in inches in tenths of an inch a minute, as Klartext takes them.
[format]
axis_decimals        = 3
inch_axis_decimals   = 4
feed_decimals        = 1
strip_trailing_zeros = true

[numbering]
enabled   = true
start     = 0
increment = 1

[modal]
suppress_motion = true
suppress_axes   = true
suppress_feed   = true
