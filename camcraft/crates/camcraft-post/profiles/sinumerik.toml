# Siemens Sinumerik 840D sl and 828D, milling, in their own G-code.
#
# Written from Siemens' programming manuals (Fundamentals and Job Planning,
# 840D sl/828D, 03/2013; Cycles, 11/2006) and as Fusion's Siemens post
# writes: ISO's moves and arcs with a Sinumerik's own words, so
# `dialect = "sinumerik"`, and src/sinumerik.rs with the G-code renderer and
# reader writes it and reads it back. The program begins `%_N_<NAME>_MPF` and
# `;$PATH=/_N_MPF_DIR`, as a Sinumerik reads one sent to it as text; `;`
# comments; G710, millimetres for lengths and feeds both. A change is `T<n> M6`
# then `D1`, the tool's first edge, which takes up its length and radius; Z
# goes to the top of the machine with its offsets let go, `G0 SUPA Z0 D0`,
# before a tool change and at the end, and `D1` takes them up again before it
# moves in the work. The next program's tool is called up after the change
# (`preselect_tool`). The same in inches is sinumerik-inch.toml (a test in
# src/profile.rs checks they agree).
#
# Work offsets: G54 to G57, then G505 to G599 (G58 and G59 are programmable
# offsets on an 840D sl, which add to the one selected). How many past G57 a
# machine has is set in its machine data (MD28080): one it has not is an alarm.
# On an 828D whose G58 and G59 are settable offsets, give
#   extended_offsets = ["G58", "G59"]
# With tool management, which calls a tool by its name, name each tool in the
# control's list by its number in the document and set
#   tool_management = true
# so a change is `T="3" M6`.
#
# A setup tilted for 3+2 is refused on a machine with rotaries: CYCLE800 is not
# written. A setup wrapped round a rotary turns it with A (or B) words, fed in
# inverse time between G93 and G94. Probing is not written: the measuring
# cycles store what they find in the control's tables.
#
# VALIDATE ON THE MACHINE with a dry run well above the work before trusting it
# on material -- a post that has only ever been read is a post that has never been
# tested.

name      = "Siemens Sinumerik 840D sl / 828D"
extension = "mpf"
dialect   = "sinumerik"
comment   = [";", ""]

# Arcs by their centre, I, J and K from the arc's start: a Sinumerik's radius
# word is CR=, and R is a parameter.
arc_style      = "ij"
tool_change    = "m6"
tool_change_seconds = 6
preselect_tool = true
# Drilling as MCALL CYCLE81 (drilling), CYCLE82 (a pause at the bottom),
# CYCLE83 (pecking, out of the hole or breaking the chip), called at each hole
# and ended by MCALL. Off until they have been dry-run on the machine; off, a
# drilling operation is posted as plain moves instead.
drill_cycles = false
# Tapping is rigid, CYCLE84, whether or not the others are on: the spindle under
# position control. With a floating (compensating) holder and no encoder,
# tap = "cycle840".
tap = "cycle"

extended_offsets = [
  "G505", "G506", "G507", "G508", "G509", "G510", "G511", "G512", "G513",
  "G514", "G515", "G516", "G517", "G518", "G519", "G520", "G521", "G522",
  "G523", "G524", "G525", "G526", "G527", "G528", "G529", "G530", "G531",
  "G532", "G533", "G534", "G535", "G536", "G537", "G538", "G539", "G540",
  "G541", "G542", "G543", "G544", "G545", "G546", "G547", "G548", "G549",
  "G550", "G551", "G552", "G553", "G554", "G555", "G556", "G557", "G558",
  "G559", "G560", "G561", "G562", "G563", "G564", "G565", "G566", "G567",
  "G568", "G569", "G570", "G571", "G572", "G573", "G574", "G575", "G576",
  "G577", "G578", "G579", "G580", "G581", "G582", "G583", "G584", "G585",
  "G586", "G587", "G588", "G589", "G590", "G591", "G592", "G593", "G594",
  "G595", "G596", "G597", "G598", "G599"
]

header = [
  ";generated by camcraft -- verify before running",
  "G17 G40 G90 G94",
]

safe_retract = ["G0 SUPA Z0 D0"]

footer = [
  "M30",
]

[format]
axis_decimals        = 3
inch_axis_decimals   = 4
feed_decimals        = 0
strip_trailing_zeros = true

[numbering]
enabled = false

[modal]
suppress_motion = true
suppress_axes   = true
suppress_feed   = true

# Machining time. Typical of a vertical machining centre, not of any one: a
# Sinumerik keeps each axis's rapid in its machine data. A carousel changer
# takes about six seconds chip to chip.
[rapid]  # mm/min
x = 30000
y = 30000
z = 30000
