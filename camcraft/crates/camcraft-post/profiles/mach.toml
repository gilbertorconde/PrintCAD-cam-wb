# Mach3 and Mach4 (Newfangled Solutions), mills and routers.
#
# Written from Mach's G-code reference and as Fusion's Mach3 and Mach4 posts
# write: `.tap` files, a safe start of `G90 G94 G91.1 G40 G49 G17` -- G91.1
# because Mach reads arc centres (I, J, K) as absolute or from the arc's start
# by a setting, and this says the latter, which is how they are written -- and
# lengths with their point. Z goes to the G28 home before a tool change and at
# the end, then X and Y: Mach's G28 position is the machine's home unless it has
# been set elsewhere. A change is `T<n> M6`, Mach's tool change macro, and the
# first move down takes up the tool's length with `G43 Z.. H<tool>`. Comments in
# capitals, holding only what Fusion's Mach posts let through. The same in
# inches is mach-inch.toml (a test in src/profile.rs checks they agree).
#
# VALIDATE ON THE MACHINE with a dry run well above the work before trusting it
# on material -- a post that has only ever been read is a post that has never been
# tested.

name      = "Mach3 / Mach4"
extension = "tap"
comment   = ["(", ")"]
comment_chars = " ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.,=_-"
comment_upper = true

arc_style     = "ij"
tool_change   = "m6"
length_offset = true
# Mach takes G81, G82, G83, G73, G84 and G74. Off until they have been dry-run
# on the machine; off, a drilling operation is posted as plain moves instead.
drill_cycles = false
# Mach4's G84 and G74 are for a floating tap holder, not synchronized with the
# spindle, and Mach3 is not known to tap at all: a tapping operation is a
# failed check.
tap = "none"

header = [
  "({name})",
  "(GENERATED BY CAMCRAFT -- VERIFY BEFORE RUNNING)",
  "G90 G94 G91.1 G40 G49 G17",
]

safe_retract = ["G28 G91 Z0.", "G90"]
end_home     = ["G28 G91 X0. Y0.", "G90"]

footer = [
  "M30",
]

[format]
axis_decimals        = 3
inch_axis_decimals   = 4
feed_decimals        = 0
strip_trailing_zeros = true
keep_point           = true

[numbering]
enabled = false

[modal]
suppress_motion = true
suppress_axes   = true
suppress_feed   = true
